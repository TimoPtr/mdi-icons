name: "Setup build environment"
description: "Setup the runner with the JDK and Gradle configuration."
inputs:
  cache-encryption-key:
    description: "Key used to encrypt the Gradle configuration cache before it is stored. This is a secret and should not be exposed."
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: "temurin"
        java-version: "25.0.5+8.0.LTS"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
