name: "Setup build environment"
description: "Setup the runner with the JDK and Gradle configuration."
inputs:
  cache-encryption-key:
    description: "Key used to encrypt the Gradle configuration cache before it is stored. This is a secret and should not be exposed."
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: "temurin"
        java-version: "21"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
