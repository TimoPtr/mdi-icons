name: "Setup build environment"
description: "Setup the runner with the JDK and Gradle configuration."
inputs:
  cache-encryption-key:
    description: "Key used to encrypt the Gradle configuration cache before it is stored. This is a secret and should not be exposed."
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "temurin"
        java-version: "25.0.4+101.0.LTS"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
