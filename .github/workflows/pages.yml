name: Deploy sample to GitHub Pages

# Publishes the web sample (wasm, falling back to JS on browsers without wasm GC) so users can
# browse the catalog without cloning the repository.
on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-progress deployment, only skip the runs queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Check out the repository.
      contents: read
      # Let actions/deploy-pages create the Pages deployment.
      pages: write
      # Let actions/deploy-pages request an OIDC token, which GitHub requires to authenticate the deployment.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the web sample
        run: ./gradlew :webApp:composeCompatibilityBrowserDistribution

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webApp/build/dist/composeWebCompatibility/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
