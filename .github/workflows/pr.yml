name: Pull Request

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register yamllint problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/yamllint.json"

      - name: Validate YAML
        run: yamllint --strict --format github .

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check code style
        run: ./gradlew ktlintCheck

      - name: Check buildSrc code style
        run: ./gradlew -p buildSrc ktlintCheck

  build_and_test:
    needs: [yamllint, ktlint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify generated MDI catalog matches the pinned version
        run: ./gradlew :shared:verifyMdiIcons

      - name: Build all targets
        run: >-
          ./gradlew
          :shared:compileKotlinJvm
          :shared:compileKotlinIosArm64
          :shared:compileKotlinJs
          :shared:compileKotlinWasmJs
          :androidApp:assembleDebug

      - name: Run tests
        run: ./gradlew :shared:jvmTest :shared:testAndroid
