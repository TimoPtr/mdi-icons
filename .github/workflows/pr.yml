name: Pull Request

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register yamllint problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/yamllint.json"

      - name: Validate YAML
        run: yamllint --strict --format github .

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check code style
        run: ./gradlew ktlintCheck

      - name: Check buildSrc code style
        run: ./gradlew -p buildSrc ktlintCheck

  build_and_test:
    needs: [yamllint, ktlint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify generated MDI catalog matches the pinned version
        run: ./gradlew :shared:verifyMdiIcons

      - name: Build all targets
        run: >-
          ./gradlew
          :shared:compileKotlinJvm
          :shared:compileKotlinIosArm64
          :shared:compileKotlinJs
          :shared:compileKotlinWasmJs
          :androidApp:assembleDebug
          :webApp:composeCompatibilityBrowserDistribution

      - name: Run tests
        run: ./gradlew :shared:jvmTest :shared:testAndroid

      # Re-records the README screenshots: any difference with the committed images means the
      # sample UI changed without regenerating them.
      - name: Record README screenshots
        run: ./gradlew :sample:recordRoborazziAndroidHostTest

      - name: Check README screenshots are up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/images)" ]; then
            git status --short -- docs/images
            echo "::error title=Outdated README screenshots::The screenshots in docs/images do not match the sample app. Run ./gradlew :sample:recordRoborazziAndroidHostTest and commit the result, or download the readme-screenshots artifact of this run."
            exit 1
          fi

      - name: Upload re-recorded screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshots
          path: docs/images
